name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Check the F-Droid changelog for this version
        run: |
          code=$(sed -nE 's/^version:[[:space:]]*[^+]+\+([0-9]+).*/\1/p' pubspec.yaml)
          f=fastlane/metadata/android/en-US/changelogs/$code.txt
          if [ ! -s "$f" ]; then
            echo "::warning::$f is missing; F-Droid will show no changelog for versionCode $code."
          elif [ "$(wc -c < "$f")" -gt 500 ]; then
            echo "::error::$f is over F-Droid's 500 character limit."; exit 1
          fi
      - name: Fetch real firmware images for the verification tests
        run: |
          mkdir -p "$RUNNER_TEMP/fw"
          base=https://raw.githubusercontent.com/arendst/Tasmota-firmware/firmware/release-firmware
          for f in tasmota/tasmota.bin tasmota/tasmota.bin.gz tasmota/tasmota-minimal.bin.gz \
                   tasmota32/tasmota32.bin tasmota32/tasmota32c3.bin tasmota32/tasmota32.factory.bin; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/fw/$(basename $f)" "$base/$f"
          done
          ls -l "$RUNNER_TEMP/fw"
          # Release metadata the app relies on (asset names and SHA-256 digests).
          for r in arendst/Tasmota openshwprojects/OpenBK7231T_App; do
            curl -fsSL -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/$r/releases/latest" |
              jq -r '"\(.tag_name) assets=\(.assets|length)", (.assets[] | select(.name|test("^(tasmota(32)?\\.bin|OpenBK7231N_.*\\.rbl)")) | "\(.name) \(.digest)")' || true
          done
      - run: flutter test
        env:
          FIRMWARE_SAMPLES: ${{ runner.temp }}/fw
      - name: Restore the release signing key
        env:
          KEYSTORE_B64: ${{ secrets.TASMOHUB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TASMOHUB_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::TASMOHUB_KEYSTORE_B64 secret not set; APK is signed with a throwaway debug key and will not install over earlier builds."
          fi
      - run: flutter build apk --release --dart-define=GIT_SHA=${{ github.sha }}
        env:
          TASMOHUB_KEYSTORE_PASSWORD: ${{ secrets.TASMOHUB_KEYSTORE_PASSWORD }}
          TASMOHUB_KEY_ALIAS: tasmohub
          TASMOHUB_KEY_PASSWORD: ${{ secrets.TASMOHUB_KEYSTORE_PASSWORD }}
      - name: Show the signing certificate
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | grep -i 'SHA-256' | head -1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: tasmohub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # Runs last so it cannot overwrite the uploaded APK.
      - name: Check the unsigned build F-Droid makes
        env:
          TASMOHUB_UNSIGNED: '1'
        run: |
          flutter build apk --release
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          if "$apksigner" verify "$apk" 2>/dev/null; then
            echo "::error::TASMOHUB_UNSIGNED=1 still produced a signed APK"; exit 1
          fi
          echo "Unsigned APK OK"

  # F-Droid builds each release from a git tag (UpdateCheckMode: Tags), so tag
  # every new pubspec version once its build on main has passed.
  tag:
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag v<version> if it does not exist yet
        run: |
          v=$(sed -nE 's/^version:[[:space:]]*([^+]+)\+.*/\1/p' pubspec.yaml)
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v already tagged"
          else
            git tag "v$v" "$GITHUB_SHA"
            git push origin "v$v"
            echo "Tagged v$v"
          fi
