# Draft recipe for the fdroiddata repository
# (https://gitlab.com/fdroid/fdroiddata), saved there as
# metadata/com.adelhajjaj.tasmo_hub.yml. Store text, icon and changelogs come
# from fastlane/metadata/android in this repo, so they are not repeated here.
Categories:
  - Connectivity
  - System
License: GPL-3.0-or-later
AuthorName: Adel Hajjaj
SourceCode: https://github.com/adelomer12/tasmo-hub
IssueTracker: https://github.com/adelomer12/tasmo-hub/issues
Changelog: https://github.com/adelomer12/tasmo-hub/commits/main

AutoName: TasmoHub

RepoType: git
Repo: https://github.com/adelomer12/tasmo-hub.git

Builds:
  - versionName: 1.1.3
    versionCode: 5
    commit: v1.1.3
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.7
    rm:
      - ios
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export TASMOHUB_UNSIGNED=1
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.1.3
CurrentVersionCode: 5
